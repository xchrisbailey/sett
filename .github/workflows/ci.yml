name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # sett targets macOS only, and the GPUI build pulls in the macOS platform layer.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: scripts/check-fork-markers
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The forked editor's view tests sit behind a feature; see docs/agents/gpui-kit-notes.md.
      - run: cargo test -p gpui-kit-markdown-editor --features view-tests,gpui-kit/test-support
