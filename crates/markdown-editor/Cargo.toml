# Fork of gpui-kit-markdown-editor 0.2.0. See FORK.md for the patches we carry.
[package]
name = "gpui-kit-markdown-editor"
version = "0.2.0"
edition.workspace = true
publish.workspace = true
description = "A block-based WYSIWYG Markdown editor for GPUI, built on gpui-kit's editor host API."
license = "Apache-2.0"
repository = "https://github.com/wabzqem/gpui-kit-markdown-editor"

[features]
default = ["syntect"]
syntect = ["gpui-kit/syntect"]
# FORK: upstream's GPUI view tests (src/tests/view.rs) need gpui-kit/test-support,
# which doesn't resolve against the workspace lockfile (it pulls in gpui-fast).
# Even an optional dependency on it breaks resolution, so this flag only gates the
# module; to run those tests, add the dev-dependency locally as well.
view-tests = []

[lib]
name = "markdown_editor"
path = "src/lib.rs"
doctest = false

[dependencies]
gpui-kit.workspace = true
markdown = "1.0.0"
unicode-segmentation = "1.12.0"
# FORK: language lookup for Code Blocks. Same versions and features gpui-kit's syntect
# highlighter already compiles, so no new crates.
syntect = { version = "5.3", default-features = false, features = ["parsing", "default-syntaxes", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
anyhow = "1"
